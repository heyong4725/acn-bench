name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gates:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny --locked
      - run: tools/ci.sh
  netem:
    # Linux-only ignored tier; runs nightly once T40 lands. Kept here so the job name is stable.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo -E cargo test --workspace --features netem -- --ignored
